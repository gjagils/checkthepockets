# Dependabot kijkt naar nieuwe versies. De lockbestanden (requirements*.txt) worden met uv gegenereerd
# (docs/DEVELOPMENT.md), dus Dependabot opent alleen meldingen voor GitHub Actions; Python-updates
# gebeuren in een geplande upgraderonde met de volledige suite (ACT-40).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
