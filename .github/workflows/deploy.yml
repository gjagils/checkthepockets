name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ""
          oauth-secret: ""
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via Portainer API
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          # Get current stack info
          STACK_INFO=$(curl -s -H "X-API-Key: $PORTAINER_API_TOKEN" "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID")
          ENDPOINT_ID=$(echo "$STACK_INFO" | jq -r '.EndpointId')
          echo "Endpoint ID: $ENDPOINT_ID"

          # Step 1: Git redeploy (pulls latest compose file + pulls image)
          echo "Triggering git redeploy..."
          REDEPLOY_RESULT=$(curl -s -X PUT \
            -H "X-API-Key: $PORTAINER_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"pullImage": true, "prune": false}' \
            "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID/git/redeploy?endpointId=$ENDPOINT_ID")
          echo "Redeploy result: $REDEPLOY_RESULT"

          # Step 2: Wait for redeploy to settle
          sleep 10

          # Step 3: Find the app container and recreate it with force pull
          echo "Finding app container..."
          CONTAINERS=$(curl -s -H "X-API-Key: $PORTAINER_API_TOKEN" \
            "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/json?all=true")
          CONTAINER_ID=$(echo "$CONTAINERS" | jq -r '.[] | select(.Names[] | contains("checkthepockets")) | select(.Names[] | contains("db") | not) | .Id')
          echo "Container ID: $CONTAINER_ID"

          if [ -n "$CONTAINER_ID" ] && [ "$CONTAINER_ID" != "null" ]; then
            echo "Recreating container with image pull..."
            RECREATE_RESULT=$(curl -s -X POST \
              -H "X-API-Key: $PORTAINER_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"pullImage": true}' \
              "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/$CONTAINER_ID/recreate")
            echo "Recreate result: $RECREATE_RESULT"
          else
            echo "WARNING: Could not find app container, skipping recreate"
          fi
