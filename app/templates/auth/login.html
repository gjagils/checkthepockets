{% extends "base.html" %}
{% block title %}Inloggen - Check Your Pockets{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-logo">
        <img src="/static/img/logo.png?v=2" alt="Check Your Pockets">
        <span class="brand-text">
            <span class="brand-line brand-check">CHECK</span>
            <span class="brand-line brand-the">YOUR</span>
            <span class="brand-line brand-pockets">POCKETS</span>
        </span>
    </div>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
        <div class="form-group">
            <label for="username">Gebruikersnaam</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Wachtwoord</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Inloggen</button>
    </form>
    {% if google_login_enabled %}
    <div style="margin:1.5rem 0; text-align:center;">
        <div style="display:flex; align-items:center; gap:.75rem; margin-bottom:1rem;">
            <div style="flex:1; height:1px; background:var(--muted-border);"></div>
            <span class="muted" style="font-size:.85rem;">of</span>
            <div style="flex:1; height:1px; background:var(--muted-border);"></div>
        </div>
        <a href="/auth/google" class="btn" style="display:inline-flex; align-items:center; gap:.6rem; width:100%; justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.01 24.01 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Inloggen met Google
        </a>
    </div>
    {% endif %}
    <p class="auth-link"><a href="/forgot-password">Wachtwoord vergeten?</a></p>
    <p class="auth-link">Nog geen account? <a href="/register">Registreren</a></p>
</div>
{% endblock %}
