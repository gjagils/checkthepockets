{% extends "base.html" %}
{% block title %}Registreren - Check Your Pockets{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-logo"><img src="/static/img/logo.png" alt="Check Your Pockets"></div>
    <h1>Registreren</h1>
    {% if errors %}
    <div class="alert alert-error">
        <ul>
        {% for e in errors %}
            <li>{{ e }}</li>
        {% endfor %}
        </ul>
    </div>
    {% endif %}
    <form method="post" action="/register">
        <input type="hidden" name="invite" value="{{ invite or '' }}">
        <div class="form-group">
            <label for="username">Gebruikersnaam</label>
            <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="email">E-mailadres <span style="color:var(--muted); font-weight:normal;">(optioneel)</span></label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" placeholder="jouw@email.nl">
        </div>
        <div class="form-group">
            <label for="password">Wachtwoord</label>
            <input type="password" id="password" name="password" required minlength="8">
        </div>
        <div class="form-group">
            <label for="password_confirm">Wachtwoord bevestigen</label>
            <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary">Registreren</button>
    </form>
    <p class="auth-link">Al een account? <a href="/login">Inloggen</a></p>
</div>
{% endblock %}
