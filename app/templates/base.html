<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Check The Pockets{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% if user %}
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <img src="/static/img/logo.png" alt="Logo">
            CHECK <span class="brand-the">THE POCKETS</span>
        </a>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/">Transacties</a>
            <a href="/categories">Categorieën</a>
            <a href="/rules">Regels</a>
            <a href="/budgets">Budgetten</a>
            <a href="/recurring">Terugkerend</a>
            <a href="/savings">Sparen</a>
            <a href="/analytics">Analyse</a>
            <a href="/accounts">Rekeningen</a>
            <a href="/import">Importeren</a>
            <a href="/settings" class="nav-user" style="text-decoration:none;">{{ user.username }}</a>
            <a href="/logout" class="btn btn-sm">Uitloggen</a>
        </div>
    </nav>
    {% endif %}
    <main class="container {% block container_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
