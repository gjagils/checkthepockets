<form method="post" action="/recurring/{{ item.id }}/edit">
    <div class="rule-condition">
        <div class="form-group">
            <label>Naam</label>
            <input type="text" name="name" value="{{ item.name }}" required>
        </div>
        <div class="form-group">
            <label>Verwacht bedrag</label>
            <input type="number" step="0.01" name="amount_expected"
                   value="{{ '%.2f'|format(item.amount_expected) }}" required>
        </div>
        <div class="form-group">
            <label>Frequentie</label>
            <select name="frequency">
                {% for key, label in frequencies.items() %}
                <option value="{{ key }}" {% if item.frequency == key %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="rule-condition">
        <div class="form-group">
            <label>Categorie</label>
            <select name="category_id">
                <option value="">Geen</option>
                {% for cat in categories %}
                {% if not cat.parent_id %}
                <optgroup label="{{ cat.name }}">
                    <option value="{{ cat.id }}" {% if item.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% for child in cat.children|sort(attribute='name') %}
                    <option value="{{ child.id }}" {% if item.category_id == child.id %}selected{% endif %}>{{ child.name }}</option>
                    {% endfor %}
                </optgroup>
                {% endif %}
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Tegenpartij (zoekterm)</label>
            <input type="text" name="counterparty" value="{{ item.counterparty or '' }}">
        </div>
        <div class="form-group">
            <label>Omschrijving (zoekterm)</label>
            <input type="text" name="description_match" value="{{ item.description_match or '' }}">
        </div>
    </div>
    <div class="rule-condition">
        <div class="form-group">
            <label>Startdatum</label>
            <input type="date" name="start_date" value="{{ item.start_date.isoformat() if item.start_date else '' }}">
        </div>
        <div class="form-group">
            <label>Einddatum</label>
            <input type="date" name="end_date" value="{{ item.end_date.isoformat() if item.end_date else '' }}">
        </div>
    </div>
    <div style="margin-top:0.5rem; display:flex; gap:0.5rem;">
        <button type="submit" class="btn btn-sm btn-primary">Opslaan</button>
        <button type="button" class="btn btn-sm" onclick="toggleRecurringEdit({{ item.id }})">Annuleren</button>
    </div>
</form>
