{% extends "base.html" %}
{% block title %}Transactie toevoegen - Check Your Pockets{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Transactie toevoegen</h1>
    <a href="/transactions" class="btn">Terug naar overzicht</a>
</div>

<div class="card">
    <form method="post" action="/transactions/create">
        <div class="form-group">
            <label for="account_id">Rekening</label>
            <select name="account_id" id="account_id" required>
                {% for account in accounts %}
                <option value="{{ account.id }}">{{ account.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="date">Datum</label>
            <input type="date" id="date" name="date" value="{{ today }}" required>
        </div>

        <div class="form-group">
            <label for="amount">Bedrag (negatief voor uitgaven)</label>
            <input type="text" id="amount" name="amount" placeholder="-12,50" required inputmode="decimal">
        </div>

        <div class="form-group">
            <label for="description">Omschrijving</label>
            <textarea id="description" name="description" rows="2" placeholder="Bijv. Boodschappen Albert Heijn"></textarea>
        </div>

        <div class="form-group">
            <label for="counterparty">Tegenpartij</label>
            <input type="text" id="counterparty" name="counterparty" placeholder="Bijv. Albert Heijn">
        </div>

        <div class="form-group">
            <label for="category_id">Categorie</label>
            <select name="category_id" id="category_id">
                <option value="">Geen categorie</option>
                {% for cat in categories %}
                {% if not cat.parent_id %}
                    {% if cat.children %}
                    <optgroup label="{{ cat.name }}">
                        {% for child in cat.children|sort(attribute='name') %}
                        <option value="{{ child.id }}">{{ child.name }}</option>
                        {% endfor %}
                    </optgroup>
                    {% else %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endif %}
                {% endif %}
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Toevoegen</button>
            <a href="/transactions" class="btn">Annuleren</a>
        </div>
    </form>
</div>
{% endblock %}
