server {
    listen 8000;

    # Use Docker's internal DNS resolver with short cache
    resolver 127.0.0.11 valid=5s;

    # Maintenance page served internally on error
    location /static/maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Logo voor de maintenance pagina: altijd lokaal serveren,
    # ook als de app down is. Gebruikt een eigen pad zodat het
    # app-logo (/static/logo.png) niet wordt overschreven.
    location = /static/maintenance-logo.png {
        alias /usr/share/nginx/html/static/maintenance-logo.png;
    }

    # When app is down, show maintenance page
    error_page 502 503 504 =503 /static/maintenance.html;

    location / {
        # Resolve at runtime (not startup) so nginx starts even if app is down
        set $backend http://checkthepockets:8000;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Short connect timeout → bij deploy valt het snel door naar maintenance.
        # Read/send timeout ruimer: AI suggesties en imports mogen langer duren.
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;

        # Intercept upstream errors so error_page werkt
        proxy_intercept_errors on;

        # Als de app hangt of traag is, ook naar maintenance pagina
        proxy_next_upstream error timeout http_502 http_503 http_504;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass large request bodies (file uploads)
        client_max_body_size 50m;
    }
}
