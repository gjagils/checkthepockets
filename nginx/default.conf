upstream app {
    server app:8000;
}

server {
    listen 8000;

    # Maintenance page served internally on error
    location /static/maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # When app is down, show maintenance page
    error_page 502 503 504 /static/maintenance.html;

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Short connect timeout so we quickly detect app-down
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass large request bodies (file uploads)
        client_max_body_size 50m;
    }
}
