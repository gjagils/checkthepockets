        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3a5c 0%, #234C75 50%, #1d3f62 100%);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: #f0f0f0;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }

        .logo {
            width: 80px;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin-bottom: 2.5rem;
        }
        .brand-check { color: #FF9800; }
        .brand-your  { color: #ffffff; }
        .brand-pockets { color: #FF9800; }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        p {
            font-size: 1rem;
            color: #a0b4c8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #FF9800;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #5a7a94;
        }
    </style>
